[agents]
max_concurrent_threads_per_session = 6

[agents.spec_planner]
description = "Analyzes requirements, designs technical architectures and interface contracts, and breaks features into verifiable OpenSpec task lists."
config_file = "agents/spec_planner.toml"

[agents.security_reviewer]
description = "Conducts independent, read-only security reviews for authentication, authorization (RLS), AI prompt boundaries/SoCLaaS gateways, browser runner execution isolation, and data protection."
config_file = "agents/security_reviewer.toml"

[agents.test_reviewer]
description = "Provides independent test and verification review. Evaluates test coverage, discovers edge cases, inspects pgTAP and Vitest test fixtures, and verifies that implementation matches acceptance scenarios."
config_file = "agents/test_reviewer.toml"

[agents.tdd_implementer]
description = "Implements bounded features or bugfixes strictly adhering to Test-Driven Development (failing test first, then implementation), respecting assigned file boundaries and repository architectural rules."
config_file = "agents/tdd_implementer.toml"

[agents.documentation_evidence]
description = "Audits documentation, local markdown links, OpenSpec artifact consistency, and session interaction logs. Ensures factual accuracy and prevents invented claims."
config_file = "agents/documentation_evidence.toml"
