schema: spec-driven
context: |
  CS3227 MP4: fresh Coursemology-inspired programming assignment platform.
  Roles: student and instructor, each with a distinct SoCLaaS AI feature.
  Next.js App Router, React, TypeScript, Tailwind, shadcn/ui, Supabase/RLS,
  Zod, Vitest, Playwright, pnpm, Vercel, GitHub Actions and GitHub Pages.
  Python execution and Java source compilation/execution entirely in browser.
  Runtime selection requires feasibility, isolation and licensing evidence.
  No uploads, badges, server execution, arbitrary student dependencies or MP reuse.
  Browser results and AI suggestions cannot publish grades or award XP.
  Read workflow/ProjectBrief.md and workflow/AgentProcess.md for context.
  Status: planning scaffold, with no implemented application features.
rules:
  design:
    - Specify isolation, ownership, revisioning, quotas and failure behavior.
    - Verify browser-only Java compilation before choosing runtime dependencies.
  specs:
    - Use SHALL requirements and WHEN/THEN scenarios including negative cases.
  tasks:
    - Keep work unchecked until implemented and validated with evidence.
    - Include security tests, independent review, documentation and logs.

