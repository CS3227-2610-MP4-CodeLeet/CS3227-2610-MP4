name: Application checks
on:
  pull_request:
  push:
    branches: [master, develop]
  workflow_dispatch:
permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
  OPENSPEC_TELEMETRY: '0'
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify Node.js 24
        run: node --eval "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:start
      - run: pnpm db:test
      - name: Stop local Supabase
        if: always()
        run: pnpm db:stop

  application:
    runs-on: ubuntu-latest
    # Match @playwright/test in package.json. Browsers and OS libraries are
    # preinstalled, avoiding apt mirror/network stalls during every CI run.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify Node.js 24
        run: node --eval "if (process.versions.node.split('.')[0] !== '24') process.exit(1)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - run: pnpm build
      - name: Product website build
        run: pnpm site:build
      - name: Browser tests (preinstalled Chromium)
        timeout-minutes: 5
        run: pnpm test:e2e
      - name: Upload failed browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
